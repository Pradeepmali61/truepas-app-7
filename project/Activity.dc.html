<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Activity</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#007aff;text-decoration:none}a:hover{color:#006ae0}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; padding: 58px 24px 0; display: flex; flex-direction: column; font-family: Inter, ui-sans-serif, system-ui, -apple-system, sans-serif; color: #1c1b1f; background: linear-gradient(180deg, #d8f6ff 0%, #f4fcff 20%, #ffffff 36%)">

  <div style="display: flex; align-items: center; justify-content: space-between">
    <h1 style="margin: 0; font-size: 32px; line-height: 38px; font-weight: 800; letter-spacing: -0.03em">Activity</h1>
    <button type="button" aria-label="Search activity" style="width: 44px; height: 44px; border: none; border-radius: 14px; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.55); box-shadow: inset 0 0 0 1px rgba(255,255,255,0.9), 2px 2px 16px rgba(0,0,0,0.08); color: #1c1b1f"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg></button>
  </div>
  <p style="margin: 4px 0 0; font-size: 14px; color: #525455">Every time your face was used — where, when, and what was shared.</p>

  <div style="margin-top: 18px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
    <div style="padding: 12px; border-radius: 16px; background: #ffffff; box-shadow: 2px 2px 16px rgba(0,0,0,0.07); display: flex; flex-direction: column; gap: 2px"><span style="font-size: 22px; font-weight: 800; letter-spacing: -0.02em">12</span><span style="font-size: 12px; color: #525455">This month</span></div>
    <div style="padding: 12px; border-radius: 16px; background: #ffffff; box-shadow: 2px 2px 16px rgba(0,0,0,0.07); display: flex; flex-direction: column; gap: 2px"><span style="font-size: 22px; font-weight: 800; letter-spacing: -0.02em; color: #007aff">1.8s</span><span style="font-size: 12px; color: #525455">Avg. check</span></div>
    <div style="padding: 12px; border-radius: 16px; background: #ffffff; box-shadow: 2px 2px 16px rgba(0,0,0,0.07); display: flex; flex-direction: column; gap: 2px"><span style="font-size: 22px; font-weight: 800; letter-spacing: -0.02em">5</span><span style="font-size: 12px; color: #525455">Places</span></div>
  </div>

  <div role="tablist" aria-label="Filter activity" style="margin-top: 18px; display: flex; gap: 8px">
    <sc-for list="{{filters}}" as="f" hint-placeholder-count="4">
      <button type="button" role="tab" aria-selected="{{f.aria}}" onClick="{{f.pick}}" style="height: 36px; padding: 0 14px; border: none; border-radius: 999px; font-size: 13px; font-weight: 600; background: {{f.bg}}; color: {{f.fg}}; box-shadow: {{f.shadow}}">{{f.label}}</button>
    </sc-for>
  </div>

  <div style="margin-top: 8px; display: flex; flex-direction: column">
    <sc-for list="{{groups}}" as="g" hint-placeholder-count="2">
      <div style="display: flex; flex-direction: column">
        <span style="margin-top: 14px; font-size: 12px; font-weight: 700; letter-spacing: 0.08em; color: #6b6f74">{{g.label}}</span>
        <sc-for list="{{g.items}}" as="it" hint-placeholder-count="2">
          <div style="display: flex; align-items: center; gap: 12px; height: 62px; border-bottom: 1px solid #f0f1f3">
            <span style="width: 40px; height: 40px; flex-shrink: 0; border-radius: 13px; background: {{it.iconBg}}; color: {{it.iconFg}}; display: flex; align-items: center; justify-content: center">
              <sc-if value="{{it.isPlane}}" hint-placeholder-val="{{true}}"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"></path></svg></sc-if>
              <sc-if value="{{it.isBed}}" hint-placeholder-val="{{false}}"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 4v16"></path><path d="M2 8h18a2 2 0 0 1 2 2v10"></path><path d="M2 17h20"></path><path d="M6 8v9"></path></svg></sc-if>
              <sc-if value="{{it.isTicket}}" hint-placeholder-val="{{false}}"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 9a3 3 0 0 1 0 6v2a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-2a3 3 0 0 1 0-6V7a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2Z"></path><path d="M13 5v2"></path><path d="M13 17v2"></path><path d="M13 11v2"></path></svg></sc-if>
              <sc-if value="{{it.isCar}}" hint-placeholder-val="{{false}}"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.4 2.9A3.7 3.7 0 0 0 2 12v4c0 .6.4 1 1 1h2"></path><circle cx="7" cy="17" r="2"></circle><path d="M9 17h6"></path><circle cx="17" cy="17" r="2"></circle></svg></sc-if>
            </span>
            <span style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
              <span style="font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{it.title}}</span>
              <span style="font-size: 12px; color: #6b6f74">{{it.meta}}</span>
            </span>
            <span style="flex-shrink: 0; padding: 4px 9px; border-radius: 999px; background: {{it.pillBg}}; color: {{it.pillFg}}; font-size: 12px; font-weight: 600">{{it.status}}</span>
          </div>
        </sc-for>
      </div>
    </sc-for>
  </div>

  <nav aria-label="Primary" style="position: absolute; left: 16px; right: 16px; bottom: 24px; height: 70px; border-radius: 24px; background: rgba(255,255,255,0.85); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); box-shadow: inset 0 0 0 1px rgba(255,255,255,0.8), 0 10px 30px rgba(15,35,70,0.14); display: flex; align-items: center; justify-content: space-around; padding: 0 6px">
    <a href="Home.dc.html" style="width: 60px; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; font-weight: 600; color: #6b6f74"><svg viewBox="0 0 24 24" width="23" height="23" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><path d="M9 22V12h6v10"></path></svg>Home</a>
    <a href="Activity.dc.html" aria-current="page" style="width: 60px; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; font-weight: 600; color: #007aff"><svg viewBox="0 0 24 24" width="23" height="23" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><path d="M12 6v6l4 2"></path></svg>Activity</a>
    <a href="Pass.dc.html" aria-label="My pass" style="width: 58px; height: 58px; margin-top: -30px; border-radius: 20px; background: linear-gradient(145deg, #3aa0ff, #007aff 55%, #0058d6); display: flex; align-items: center; justify-content: center; color: #ffffff; box-shadow: 0 10px 22px rgba(0,122,255,0.4), inset 0 1px 0 rgba(255,255,255,0.35), 0 0 0 5px #ffffff"><svg viewBox="0 0 24 24" width="27" height="27" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7V5a2 2 0 0 1 2-2h2"></path><path d="M17 3h2a2 2 0 0 1 2 2v2"></path><path d="M21 17v2a2 2 0 0 1-2 2h-2"></path><path d="M7 21H5a2 2 0 0 1-2-2v-2"></path><path d="M8 14s1.5 2 4 2 4-2 4-2"></path><path d="M9 9h.01"></path><path d="M15 9h.01"></path></svg></a>
    <a href="Documents.dc.html" style="width: 60px; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; font-weight: 600; color: #6b6f74"><svg viewBox="0 0 24 24" width="23" height="23" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1"></path><path d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4"></path></svg>Wallet</a>
    <a href="Profile.dc.html" style="width: 60px; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; font-weight: 600; color: #6b6f74"><svg viewBox="0 0 24 24" width="23" height="23" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>Profile</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { filter: 'all' };
}
renderVals() {
const filter = this.state.filter;
const ok = { status: 'Verified', pillBg: '#e7f6ee', pillFg: '#0e7a43', iconBg: '#f4fcff', iconFg: '#007aff' };
const all = [
{ day: 'TODAY', cat: 'travel', icon: 'plane', title: 'SFO Gate B12 · Boarding', meta: '08:41 · 1.8s', s: ok },
{ day: 'TODAY', cat: 'travel', icon: 'plane', title: 'SFO Security · Lane 4', meta: '08:12 · 1.6s', s: ok },
{ day: 'TODAY', cat: 'stays', icon: 'bed', title: 'Harbor Hotel · Check-out', meta: '06:30 · 1.9s', s: ok },
{ day: 'YESTERDAY', cat: 'venues', icon: 'ticket', title: 'Bay Arena · Gate C entry', meta: '19:05 · 2.1s', s: ok },
{ day: 'YESTERDAY', cat: 'travel', icon: 'car', title: 'Swift Car Rentals · Pickup', meta: '10:02 · Car rentals is off', s: { status: 'Blocked', pillBg: '#fff1e6', pillFg: '#b45309', iconBg: '#fff7f0', iconFg: '#b45309' } }
];
const rows = all.filter((r) => filter === 'all' || r.cat === filter);
const days = [];
rows.forEach((r) => {
let g = days.find((d) => d.label === r.day);
if (!g) { g = { label: r.day, items: [] }; days.push(g); }
g.items.push(Object.assign({ title: r.title, meta: r.meta, isPlane: r.icon === 'plane', isBed: r.icon === 'bed', isTicket: r.icon === 'ticket', isCar: r.icon === 'car' }, r.s));
});
const defs = [['all', 'All'], ['travel', 'Travel'], ['stays', 'Stays'], ['venues', 'Venues']];
return {
groups: days,
filters: defs.map(([id, label]) => ({
label: label,
aria: filter === id ? 'true' : 'false',
bg: filter === id ? '#1c1b1f' : '#ffffff',
fg: filter === id ? '#ffffff' : '#2a2a2a',
shadow: filter === id ? 'none' : 'inset 0 0 0 1px #e3e6ea',
pick: () => this.setState({ filter: id })
}))
};
}
}
</script>
</body>
</html>
