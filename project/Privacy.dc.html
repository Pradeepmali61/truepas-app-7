<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Privacy and control</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#007aff;text-decoration:none}a:hover{color:#006ae0}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; padding: 58px 24px 34px; display: flex; flex-direction: column; font-family: Inter, ui-sans-serif, system-ui, -apple-system, sans-serif; color: #1c1b1f; background: linear-gradient(180deg, #d8f6ff 0%, #f4fcff 22%, #ffffff 40%)">

  <div style="display: flex; align-items: center; justify-content: space-between">
    <a href="Profile.dc.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 14px; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.55); box-shadow: inset 0 0 0 1px rgba(255,255,255,0.9), 2px 2px 16px rgba(0,0,0,0.08); color: #1c1b1f"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg></a>
    <span style="font-size: 17px; font-weight: 700">Privacy &amp; control</span>
    <span style="width: 44px"></span>
  </div>

  <section style="margin-top: 20px; display: flex; gap: 14px; align-items: center; padding: 18px; border-radius: 22px; background: rgba(255,255,255,0.6); box-shadow: inset 0 0 0 1px rgba(255,255,255,0.95), 2px 2px 16px rgba(0,0,0,0.07)">
    <span style="width: 56px; height: 56px; flex-shrink: 0; border-radius: 18px; background: linear-gradient(145deg, #3aa0ff, #007aff 55%, #0058d6); color: #ffffff; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 22px rgba(0,122,255,0.3)"><svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"></path><path d="m9 12 2 2 4-4"></path></svg></span>
    <span style="display: flex; flex-direction: column; gap: 4px">
      <span style="font-size: 20px; line-height: 24px; font-weight: 800; letter-spacing: -0.02em">Your face, your control.</span>
      <span style="font-size: 13px; line-height: 18px; color: #525455">Encrypted, never sold, deletable in a few taps.</span>
    </span>
  </section>

  <h2 style="margin: 24px 0 0; font-size: 12px; font-weight: 700; letter-spacing: 0.08em; color: #525455">WHO CAN VERIFY YOU</h2>
  <div style="margin-top: 10px; border-radius: 20px; background: #ffffff; box-shadow: 2px 2px 16px rgba(0,0,0,0.08); padding: 2px 16px">
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="4">
      <div style="display: flex; align-items: center; gap: 12px; height: 56px; border-bottom: {{r.divider}}">
        <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 1px">
          <span style="font-size: 15px; font-weight: 600">{{r.name}}</span>
          <span style="font-size: 12px; color: #6b6f74">{{r.note}}</span>
        </span>
        <button type="button" role="switch" aria-checked="{{r.ariaOn}}" aria-label="{{r.name}}" onClick="{{r.toggle}}" style="width: 51px; height: 31px; flex-shrink: 0; border: none; padding: 0; border-radius: 16px; background: {{r.trackColor}}; position: relative; transition: background 0.2s">
          <span style="position: absolute; top: 2px; left: {{r.knobLeft}}; width: 27px; height: 27px; border-radius: 14px; background: #ffffff; box-shadow: 0 2px 6px rgba(0,0,0,0.2); transition: left 0.2s"></span>
        </button>
      </div>
    </sc-for>
  </div>

  <h2 style="margin: 24px 0 0; font-size: 12px; font-weight: 700; letter-spacing: 0.08em; color: #525455">YOUR DATA</h2>
  <div style="margin-top: 10px; border-radius: 20px; background: #ffffff; box-shadow: 2px 2px 16px rgba(0,0,0,0.08); padding: 2px 16px">
    <a href="#" style="display: flex; align-items: center; gap: 12px; height: 56px; border-bottom: 1px solid #f0f1f3; color: #1c1b1f">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#007aff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><path d="m7 10 5 5 5-5"></path><path d="M12 15V3"></path></svg>
      <span style="flex-grow: 1; font-size: 15px; font-weight: 600">Download a copy of my data</span>
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#9a9ea4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg>
    </a>
    <a href="#" style="display: flex; align-items: center; gap: 12px; height: 56px; color: #d93636">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"></path><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path></svg>
      <span style="flex-grow: 1; font-size: 15px; font-weight: 600">Delete my biometric data</span>
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#9a9ea4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg>
    </a>
  </div>

  <div style="flex-grow: 1"></div>
  <p style="margin: 0; text-align: center; font-size: 12px; line-height: 18px; color: #6b6f74">Your face template is stored encrypted. There is no central face database.</p>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { on: { air: true, hotel: true, car: false, health: false } };
}
renderVals() {
const on = this.state.on;
const list = [
{ id: 'air', name: 'Airports & airlines', onNote: '3 places this month', offNote: 'Off — use your documents' },
{ id: 'hotel', name: 'Hotels', onNote: '1 place this month', offNote: 'Off — use your documents' },
{ id: 'car', name: 'Car rentals', onNote: 'Counter-free pickup', offNote: 'Off · 1 blocked attempt' },
{ id: 'health', name: 'Healthcare', onNote: 'Patient check-in', offNote: 'Off' }
];
return {
rows: list.map((r, i) => ({
name: r.name,
note: on[r.id] ? r.onNote : r.offNote,
ariaOn: on[r.id] ? 'true' : 'false',
trackColor: on[r.id] ? '#007aff' : '#e3e5e8',
knobLeft: on[r.id] ? '22px' : '2px',
divider: i === list.length - 1 ? 'none' : '1px solid #f0f1f3',
toggle: () => this.setState({ on: Object.assign({}, on, { [r.id]: !on[r.id] }) })
}))
};
}
}
</script>
</body>
</html>
