<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Consent and privacy</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#007aff;text-decoration:none}a:hover{color:#006ae0}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; padding: 58px 24px 34px; display: flex; flex-direction: column; font-family: Inter, ui-sans-serif, system-ui, -apple-system, sans-serif; color: #1c1b1f; background: linear-gradient(180deg, #d8f6ff 0%, #f4fcff 22%, #ffffff 40%)">

  <div style="display: flex; align-items: center; justify-content: space-between">
    <a href="FaceScan.dc.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 14px; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.55); box-shadow: inset 0 0 0 1px rgba(255,255,255,0.9), 2px 2px 16px rgba(0,0,0,0.08); color: #1c1b1f"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg></a>
    <span style="font-size: 13px; font-weight: 600; color: #525455">Step 4 of 4</span>
  </div>
  <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; margin-top: 18px" aria-hidden="true">
    <span style="height: 4px; border-radius: 2px; background: #007aff"></span>
    <span style="height: 4px; border-radius: 2px; background: #007aff"></span>
    <span style="height: 4px; border-radius: 2px; background: #007aff"></span>
    <span style="height: 4px; border-radius: 2px; background: #007aff"></span>
  </div>

  <h1 style="margin: 24px 0 0; font-size: 30px; line-height: 36px; font-weight: 800; letter-spacing: -0.03em">You decide who<br>can verify you</h1>
  <p style="margin: 8px 0 0; font-size: 15px; line-height: 22px; color: #525455">Turn on the places where you’d like to use your face. Change this anytime.</p>

  <div style="display: flex; gap: 6px; margin-top: 16px; flex-wrap: wrap">
    <span style="padding: 6px 10px; border-radius: 999px; background: #ffffff; box-shadow: 2px 2px 12px rgba(0,0,0,0.06); font-size: 12px; font-weight: 600; color: #2a2a2a; display: flex; align-items: center; gap: 6px"><span style="width: 6px; height: 6px; border-radius: 3px; background: #007aff"></span>Encrypted template</span>
    <span style="padding: 6px 10px; border-radius: 999px; background: #ffffff; box-shadow: 2px 2px 12px rgba(0,0,0,0.06); font-size: 12px; font-weight: 600; color: #2a2a2a; display: flex; align-items: center; gap: 6px"><span style="width: 6px; height: 6px; border-radius: 3px; background: #007aff"></span>No central face database</span>
    <span style="padding: 6px 10px; border-radius: 999px; background: #ffffff; box-shadow: 2px 2px 12px rgba(0,0,0,0.06); font-size: 12px; font-weight: 600; color: #2a2a2a; display: flex; align-items: center; gap: 6px"><span style="width: 6px; height: 6px; border-radius: 3px; background: #007aff"></span>Delete anytime</span>
  </div>

  <div style="margin-top: 18px; border-radius: 20px; background: #ffffff; box-shadow: 2px 2px 16px rgba(0,0,0,0.08); padding: 4px 16px">
    <sc-for list="{{industries}}" as="it" hint-placeholder-count="6">
      <div style="display: flex; align-items: center; gap: 12px; height: 62px; border-bottom: {{it.divider}}">
        <span style="width: 38px; height: 38px; flex-shrink: 0; border-radius: 12px; background: #f4fcff; box-shadow: inset 0 0 0 1px #d8f6ff; color: #007aff; display: flex; align-items: center; justify-content: center">
          <sc-if value="{{it.isPlane}}" hint-placeholder-val="{{true}}"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"></path></svg></sc-if>
          <sc-if value="{{it.isBed}}" hint-placeholder-val="{{false}}"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 4v16"></path><path d="M2 8h18a2 2 0 0 1 2 2v10"></path><path d="M2 17h20"></path><path d="M6 8v9"></path></svg></sc-if>
          <sc-if value="{{it.isCar}}" hint-placeholder-val="{{false}}"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.4 2.9A3.7 3.7 0 0 0 2 12v4c0 .6.4 1 1 1h2"></path><circle cx="7" cy="17" r="2"></circle><path d="M9 17h6"></path><circle cx="17" cy="17" r="2"></circle></svg></sc-if>
          <sc-if value="{{it.isShip}}" hint-placeholder-val="{{false}}"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 21c.6.5 1.2 1 2.5 1 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1 .6.5 1.2 1 2.5 1 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1"></path><path d="M19.38 20A11.6 11.6 0 0 0 21 14l-9-4-9 4c0 2.9.94 5.34 2.81 7.76"></path><path d="M19 13V7a2 2 0 0 0-2-2H7a2 2 0 0 0-2 2v6"></path><path d="M12 10v4"></path><path d="M12 2v3"></path></svg></sc-if>
          <sc-if value="{{it.isTicket}}" hint-placeholder-val="{{false}}"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 9a3 3 0 0 1 0 6v2a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-2a3 3 0 0 1 0-6V7a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2Z"></path><path d="M13 5v2"></path><path d="M13 17v2"></path><path d="M13 11v2"></path></svg></sc-if>
          <sc-if value="{{it.isHeart}}" hint-placeholder-val="{{false}}"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"></path></svg></sc-if>
        </span>
        <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0">
          <span style="font-size: 15px; font-weight: 600">{{it.name}}</span>
          <span style="font-size: 12px; color: #6b6f74; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{it.where}}</span>
        </span>
        <button type="button" role="switch" aria-checked="{{it.ariaOn}}" aria-label="{{it.name}}" onClick="{{it.toggle}}" style="width: 51px; height: 31px; flex-shrink: 0; border: none; padding: 0; border-radius: 16px; background: {{it.trackColor}}; position: relative; transition: background 0.2s">
          <span style="position: absolute; top: 2px; left: {{it.knobLeft}}; width: 27px; height: 27px; border-radius: 14px; background: #ffffff; box-shadow: 0 2px 6px rgba(0,0,0,0.2); transition: left 0.2s"></span>
        </button>
      </div>
    </sc-for>
  </div>

  <div style="flex-grow: 1"></div>
  <a href="Enrolled.dc.html" style="height: 54px; border-radius: 14px; background: #007aff; color: #ffffff; font-size: 16px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 10px 24px rgba(0,122,255,0.28), inset 0 1px 0 rgba(255,255,255,0.25)">Agree &amp; finish setup</a>
  <p style="margin: 14px 0 0; text-align: center; font-size: 12px; line-height: 18px; color: #6b6f74">Read how your data is used in our <a href="#">Privacy Notice</a></p>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { on: { air: true, hotel: true, car: false, cruise: true, venue: true, health: false } };
}
renderVals() {
const on = this.state.on;
const rows = [
{ id: 'air', name: 'Airports & airlines', where: 'Check-in, security, lounge, boarding', icon: 'plane' },
{ id: 'hotel', name: 'Hotels', where: 'Front desk, room access, amenities', icon: 'bed' },
{ id: 'car', name: 'Car rentals', where: 'Counter-free pickup and return', icon: 'car' },
{ id: 'cruise', name: 'Cruise', where: 'Terminal, embarkation, onboard', icon: 'ship' },
{ id: 'venue', name: 'Stadiums, venues & parks', where: 'Gates, VIP areas, season passes', icon: 'ticket' },
{ id: 'health', name: 'Healthcare', where: 'Patient check-in and records', icon: 'heart' }
];
return {
industries: rows.map((r, i) => ({
name: r.name,
where: r.where,
isPlane: r.icon === 'plane', isBed: r.icon === 'bed', isCar: r.icon === 'car', isShip: r.icon === 'ship', isTicket: r.icon === 'ticket', isHeart: r.icon === 'heart',
ariaOn: on[r.id] ? 'true' : 'false',
trackColor: on[r.id] ? '#007aff' : '#e3e5e8',
knobLeft: on[r.id] ? '22px' : '2px',
divider: i === rows.length - 1 ? 'none' : '1px solid #f0f1f3',
toggle: () => this.setState({ on: Object.assign({}, on, { [r.id]: !on[r.id] }) })
}))
};
}
}
</script>
</body>
</html>
